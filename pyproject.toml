[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-python-freecodecamp"
version = "0.1.0"
description = "A project for practicing Python concepts from freeCodeCamp"
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
